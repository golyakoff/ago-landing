name: CI

# `15-07`/`adr/0051`. This repository had no workflow at all until now, which was defensible only
# while nothing here was published: one hand-written HTML file, built on the node, imported into
# containerd under a mutable `:local` tag. It is not defensible now that the apex page is an image
# in a registry, so this file gives it the two things the other frontends already have - a check
# that the artefact builds on every pull request, and a publish that happens only from `main`.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # There is no npm project here, so there is nothing to typecheck, lint or unit-test - the whole
  # deliverable is index.html and the Dockerfile that wraps it. Building the image *is* the test:
  # it catches a missing file, a broken base-image tag, and (via the check below) a version.json
  # that would ship without a commit in it. Inventing a linter to make this job look like
  # ago-console's would be ceremony, not coverage.
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --build-arg "GIT_COMMIT=${{ github.sha }}" -t ago-landing:ci .

      - name: Check the image can name its own commit
        run: |
          set -euo pipefail
          served=$(docker run --rm --entrypoint cat ago-landing:ci /usr/share/nginx/html/version.json)
          echo "$served"
          echo "$served" | grep -q '"commit":"${{ github.sha }}"'

  # Only on `main`, and only after build-image passed - a pull request never publishes, so a fork or
  # a draft branch cannot put an image into the registry a deploy might later reach for. Modelled on
  # ago-chat's own publish-images job (adr/0047).
  publish-images:
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A repository's own GITHUB_TOKEN can write to that repository's own package feed - the same
      # property adr/0018 already relies on for the NuGet feed, so publishing needs no new secret.
      # Only *reading* a private package would, which is exactly why adr/0047 wants these public.
      packages: write
    steps:
      - uses: actions/checkout@v5

      # No docker/login-action: `docker login` with the workflow token does the same thing with one
      # fewer third-party action in the supply chain.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Rebuilt rather than carried over from build-image: two layers on top of a cached base take
      # seconds, and passing an image between jobs means a tarball artifact - more machinery than
      # the thing it would save. GIT_COMMIT is the only build arg this image has, by design
      # (adr/0051): there is no environment input to leave out.
      - name: Build and push the landing image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/ago-landing"
          docker build \
            --build-arg "GIT_COMMIT=${{ github.sha }}" \
            -t "${repo}:${{ github.sha }}" \
            -t "${repo}:main" \
            .
          docker push "${repo}:${{ github.sha }}"
          docker push "${repo}:main"

      - name: Summarise what was published
        run: |
          {
            echo "### Image published"
            echo
            echo "Deploy with: \`./deploy.sh landing ${{ github.sha }}\` (ago-deploy/k8s, on the node)"
            echo
            echo "- \`ghcr.io/${{ github.repository_owner }}/ago-landing:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
