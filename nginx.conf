# `15-08`: this image serves two fixed-filename files (index.html, version.json), and stock nginx
# sends no Cache-Control at all for a static file with no directive naming one - found live
# 2026-08-30 via ago-widget, which shared the identical gap (full incident:
# ago-root's own docs/backlog/15-08-static-frontend-cache-headers.md).
#
# `no-cache` (despite the name) does not mean "never cache" - it means "never trust a cached copy
# without asking first". nginx already sends ETag/Last-Modified for every static file by default, so
# a revalidation is one small conditional request answered with a cheap 304 when nothing changed.
# There is no hashed-filename asset class here to treat differently (this repository has no build
# step at all, ago-widget's own nginx.conf remarks explain the same reasoning in full) - one file,
# one policy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
