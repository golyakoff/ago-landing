# `15-08`: this image serves a handful of fixed-filename files (index.html, pricing.html, styles.css,
# i18n.js, version.json, and prices.json when there is one), and stock nginx
# sends no Cache-Control at all for a static file with no directive naming one - found live
# 2026-08-30 via ago-widget, which shared the identical gap (full incident:
# ago-root's own docs/backlog/15-08-static-frontend-cache-headers.md).
#
# `no-cache` (despite the name) does not mean "never cache" - it means "never trust a cached copy
# without asking first". nginx already sends ETag/Last-Modified for every static file by default, so
# a revalidation is one small conditional request answered with a cheap 304 when nothing changed.
# There is no hashed-filename asset class here to treat differently (this repository has no build
# step at all, ago-widget's own nginx.conf remarks explain the same reasoning in full) - one policy
# for every file. That matters more now than when this said "one file": `prices.json` changes
# whenever a price does, and a cached copy of it would show a visitor yesterday's price on a page
# whose whole claim is that its figures are the real ones.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        # `$uri.html` is the one addition to the original two-term list, and it buys exactly one
        # thing: `reserve-me.ru/pricing` resolves to `pricing.html`. That is the URL a person types
        # or pastes into a message, and the alternative - telling them to write `.html` - is a worse
        # answer than three words of configuration. `/pricing.html` keeps working unchanged, since
        # the first term still matches it directly.
        try_files $uri $uri.html $uri/ =404;
    }
}
